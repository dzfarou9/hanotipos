name: pos_app
description: A POS System Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
   
  connectivity_plus: ^6.0.3
  cupertino_icons: ^1.0.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  uuid: ^4.2.1
  
  # ⭐ Firebase Dependencies
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_app_check: ^0.4.6
  
  google_mlkit_barcode_scanning: ^0.13.0
  camera: ^0.11.0+1
  
  qr_flutter: ^4.1.0
  encrypt: ^5.0.3

  image_picker: ^1.1.2

  provider: ^6.1.1
  shared_preferences: ^2.2.3
  easy_localization: ^3.0.7
  
  printing: ^5.11.1
  pdf: ^3.10.7
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  audioplayers: ^6.1.0
  flutter_file_dialog: ^3.0.0
  url_launcher: ^6.3.0
  firebase_remote_config: ^6.6.0
  fl_chart: ^1.2.0
  http: ^1.2.2
  crypto: ^3.0.6
  window_manager: ^0.4.3
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  # ⭐ يُستخدم فقط في اختبارات الـ widgets (تثبيت الخط في الـ harness)
  google_fonts: ^6.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/translations/
    - assets/audio/
    - assets/fonts/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700